version: "3.9"

# Production overrides — used in AWS ECS (no local volumes, external DB/Redis)
# Run with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    env_file: .env.prod
    environment:
      ENVIRONMENT: production
    volumes: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/sehatsamjho-api
        awslogs-region: ap-south-1
        awslogs-stream-prefix: ecs

  # postgres and redis are NOT in prod compose — use AWS RDS + ElastiCache
  postgres:
    deploy:
      replicas: 0

  redis:
    deploy:
      replicas: 0
