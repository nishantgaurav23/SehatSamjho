[project]
name = "sehatsamjho"
version = "0.1.0"
description = "AI Medical Document Translator via WhatsApp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.28",
    "redis>=4.5",
    "anthropic>=0.40",
    "openai>=1.0",
    "tenacity>=8.2",
    "loguru>=0.7",
    "httpx>=0.25",
    "boto3>=1.28",
    "pydantic-settings>=2.0",
    "twilio>=8.0",
    "python-multipart>=0.0.6",
    "alembic>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
    "ruff>=0.9",
    "pytest-mock>=3.11",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
